# Grafana 数据源自动置备（OTel plan 阶段 5）。
# Prometheus 为默认数据源（指标），Tempo 提供 trace 查询。两者都是 compose 内
# 服务名、loopback 之外的网格内访问，不拨公网。
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
