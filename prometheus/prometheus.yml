# Prometheus — the local metrics backend (OTel plan phase 4).
#
# It scrapes the collector's Prometheus exporter (port 8889); the collector in
# turn scrapes agent-world's /metrics. Single metrics backend for the stack,
# no external dial-out.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
