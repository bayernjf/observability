# Tempo — local single-backend trace storage (OTel plan D1 recommendation).
# Monolithic mode, local disk only, no object storage / no external calls.
# Sizing is deliberately small for self-use traffic; retention is bounded by
# the compactor and the local volume (no cloud, no PAYG).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  # Tempo 2.6.1 supports block_retention only; retention_concurrency is a
  # newer field and makes the container crash-loop on startup.
  compaction:
    block_retention: 168h          # 7 days; self-use trace window

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
