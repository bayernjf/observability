# OTel collector — local-only observability pipeline (OTel plan phase 1).
# Receives OTLP/HTTP from Tier0 services over tier0-net, batches, and exports
# to the local Tempo container. No external dial-out: every endpoint below is
# an in-network container name. Loopback/host processes reach it via the
# published 127.0.0.1:4318 port.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: agent-world
          scrape_interval: 15s
          static_configs:
            - targets: ["agent-world:8791"]
        - job_name: loom-backend
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["backend:8000"]
        - job_name: atlas
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["atlas:8000"]
        # zeus (phase 8): the decision runtime's own concurrency accounting,
        # projected to Prometheus text by src/observability/prometheus.ts. Same
        # snapshot as the bearer-only /api/metrics, so the dashboard and the
        # operator deck can never disagree. No authorization block: zeus leaves
        # ZEUS_METRICS_TOKEN unset on tier0-net and publishes only on loopback
        # (127.0.0.1:18787). If that token is ever set, add
        # `authorization: {credentials: ...}` here from an env var, not a literal.
        - job_name: zeus
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["zeus:8787"]

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Local self-use: full sampling for now (plan D3). Keep the seam so a
  # tail/head sampler can be dropped in without touching service configs.
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheus exporter: re-serves the scraped metrics on 8889 for the
  # Prometheus backend to scrape. Single metrics fan-out point.
  prometheus:
    endpoint: 0.0.0.0:8889
  # Fail-soft debug outlet: if Tempo is down, logs the spans instead of
  # blocking. Services already treat export failures as non-fatal.
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
